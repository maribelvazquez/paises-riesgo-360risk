            { name: "Syria", nameEs: "Siria", gafi: "Monitoreo Intensificado (Lista Gris)", euAml: "Alto Riesgo", euTax: null, euTaxNota: null, sanciones: "Amplias / Sectoriales", sancionesNota: "Programa reconfigurado: OFAC archivó \"Syria Sanctions\" y lo sustituyó por PAARSS (dirigido); Caesar Act derogado (dic-2025); rescisión SST en curso.", cpiScore: 15, gtiRank: 6, mexTaxHaven: "No", ocIndexScore: 6.98, analysis: "Jurisdicción en transición con riesgo elevado y cambio normativo acelerado. Permanece en la lista gris del GAFI y en la lista de alto riesgo PLD/FT de la UE. El régimen de sanciones se reconfiguró por completo: OFAC archivó el programa integral 'Syria Sanctions' y lo sustituyó por PAARSS, de alcance dirigido; el Caesar Act fue derogado en diciembre de 2025; y el 8 de julio de 2026 EE. UU. inició el proceso de rescisión de su designación como Estado Patrocinador del Terrorismo, aún no consumado. VERIFICAR EL ESTATUS ANTES DE OPERAR: el marco cambia trimestralmente. El riesgo de fondo —conflicto, colapso institucional, corrupción (CPI 15) y terrorismo (GTI #6)— no ha variado." },

            { name: "South Africa", nameEs: "Sudáfrica", gafi: null, euAml: null, euTax: null, euTaxNota: null, sanciones: null, sancionesNota: null, cpiScore: 41, gtiRank: null, mexTaxHaven: "No", ocIndexScore: 7.43, analysis: "Fuera de las listas del GAFI y de la UE tras reformas estructurales. Los riesgos inherentes persisten y son de primer orden: criminalidad organizada muy elevada (OC Index 7.43, #7 mundial), secuelas del 'state capture', delitos financieros sofisticados y violencia asociada al crimen organizado. La mejora normativa no elimina el riesgo operativo." },

          const getLevel = (status) => {

            if (status.includes('Negra') || status.includes('Suspendido') || status.includes('Integrales')) return 'Crítico';
            if (status.includes('Gris') || status.includes('Alto Riesgo') || status.includes('Anexo I') || status.includes('Amplias')) return 'Alto';
            if (status.includes('Anexo II') || status.includes('REFIPRES') || status.includes('Dirigidas')) return 'Medio';
            return 'N/A';
          };
          
          const calculatedLevel = getLevel(text);

          return (
            <span className={`inline-flex items-center justify-center px-3 py-1 text-sm font-semibold text-white rounded-full border-2 ${levelStyles[calculatedLevel]}`}>

        // --- 360SCORE: Calificación de Riesgo PLD/FT Consolidada ---
        // --- 360SCORE v2: Metodología corregida ---
        // Distinción clave: "Prohibido" (hard stop regulatorio) vs "Riesgo Extremo" (decisión de negocio)
        const calculate360Score = (c) => {
          let max = 1;

          // GAFI — Lista Negra es un hard stop regulatorio absoluto
          if (c.gafi && c.gafi.includes('Negra')) max = Math.max(max, 5);
          else if (c.gafi && c.gafi.includes('Gris')) max = Math.max(max, 4);
          else if (c.gafi === 'Suspendido') max = Math.max(max, 4);

          // SANCIONES (v10) — las sanciones integrales son el segundo hard stop
          if (c.sanciones === 'Integrales') max = Math.max(max, 5);
          else if (c.sanciones === 'Amplias / Sectoriales') max = Math.max(max, 4);
          else if (c.sanciones === 'Dirigidas (ONU/UE)') max = Math.max(max, 3);

          // UE AML → solo sube a 3 por sí sola (no a 4)
          // Refleja vigilancia elevada, no prohibición
          if (c.euAml === 'Alto Riesgo') max = Math.max(max, 3);

          // UE Fiscal
          if (c.euTax && c.euTax.includes('Anexo I -')) max = Math.max(max, 3);
          else if (c.euTax && c.euTax.includes('Anexo II')) max = Math.max(max, 2);

          // CPI — umbrales calibrados: solo CPI ≤25 sube a 4 (corrupción sistémica extrema)
          if (c.cpiScore !== null && c.cpiScore !== undefined) {
            if (c.cpiScore <= 15) max = Math.max(max, 5);
            else if (c.cpiScore <= 25) max = Math.max(max, 4);
            else if (c.cpiScore <= 40) max = Math.max(max, 3);
            else if (c.cpiScore <= 55) max = Math.max(max, 2);
          }

          // GTI — solo top 3 llega a 5; top 8 a 4 (terrorismo dominante)
          if (c.gtiRank !== null && c.gtiRank !== undefined) {
            if (c.gtiRank <= 3) max = Math.max(max, 5);
            else if (c.gtiRank <= 8) max = Math.max(max, 4);
            else if (c.gtiRank <= 15) max = Math.max(max, 3);
            else if (c.gtiRank <= 25) max = Math.max(max, 2);
          }

          // OC Index — umbral 7.5 para nivel 4 (crimen organizado dominante)
          if (c.ocIndexScore !== null && c.ocIndexScore !== undefined) {
            if (c.ocIndexScore >= 8.5) max = Math.max(max, 5);
            else if (c.ocIndexScore >= 7.5) max = Math.max(max, 4);
            else if (c.ocIndexScore >= 7.0) max = Math.max(max, 3);
            else if (c.ocIndexScore >= 6.5) max = Math.max(max, 2);
          }

          // México LISR / REFIPRES
          if (c.mexTaxHaven === 'Sí (REFIPRES)') max = Math.max(max, 2);

          return max;
        };

        const isHardStopCountry = (c) => Boolean(
          (c.gafi && c.gafi.includes('Negra')) || c.sanciones === 'Integrales'
        );

        const get360Label = (score, country) => {
          const gafi = country && country.gafi;
          const hard = country && isHardStopCountry(country);
          const enNegra = Boolean(gafi && gafi.includes('Negra'));
          if (score === 5 && enNegra) return {
            label: 'PROHIBIDO',
            sub: 'Obligación regulatoria — no operar',
            action: country.sanciones === 'Integrales' ? 'GAFI Lista Negra + sanciones integrales' : 'GAFI Lista Negra'
          };
          if (score === 5 && hard) return {
            label: 'BLOQUEO POR SANCIONES',
            sub: 'Embargo integral — exposición a sanción secundaria',
            action: 'Prohibición de facto — validar con Jurídico antes de cualquier operación'
          };
          if (score === 5)                  return { label: 'Riesgo Extremo', sub: 'DDC máxima — decisión de negocio', action: 'Aprobación Dirección + Comité' };
          if (score === 4)                  return { label: 'Riesgo Alto', sub: 'DDC reforzada obligatoria', action: 'Aprobación Oficial de Cumplimiento' };
          if (score === 3)                  return { label: 'Riesgo Elevado', sub: 'DDC específica requerida', action: 'Revisión periódica intensificada' };
          if (score === 2)                  return { label: 'Riesgo Moderado', sub: 'DDC estándar con seguimiento', action: 'Monitoreo transaccional regular' };
          return                                   { label: 'Riesgo Bajo', sub: 'DDC estándar', action: 'Proceso ordinario' };
        };

        const Score360Badge = ({ country }) => {
          const score = calculate360Score(country);
          const { label, sub, action } = get360Label(score, country);
          const isHardStop = score === 5 && isHardStopCountry(country);

          const palette = {
            5: { bg: isHardStop ? '#3b0000' : '#1a0a1a', border: isHardStop ? '#dc2626' : '#9333ea', text: isHardStop ? '#fca5a5' : '#e9d5ff', glow: isHardStop ? '#dc262666' : '#9333ea55' },

          return (

                  <div style={{ fontSize: '0.8rem', color: '#a8a29e', marginTop: '3px' }}>{sub}</div>
                  <div style={{ marginTop: '6px', display: 'inline-block', background: p.bg, border: `1px solid ${p.border}`, borderRadius: '6px', padding: '2px 10px', fontSize: '0.72rem', color: p.text, fontWeight: 600 }}>

                  <div style={{ fontSize: '1.1rem', fontWeight: 700, color: '#d97706' }}>{score} / 5</div>
                </div>
              </div>
            </div>
          );
        };

        const OCIndexIndicator = ({ score }) => {
            if (score === null || score === undefined) {
                return <span className="font-semibold" style={{color: colors.textMuted}}>N/A</span>;

            let colorClass = '';

        const CountryCard = ({ country }) => {

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-6">

                    <p><span className="font-semibold" style={{color: colors.textMuted}}>UE (ALD):</span> <RiskIndicator text={country.euAml} /></p>
                    <p><span className="font-semibold" style={{color: colors.textMuted}}>UE (Fiscal):</span> <RiskIndicator text={country.euTax} /></p>
                    {country.euTaxNota && <p className="text-xs italic pl-1" style={{color: colors.textMuted}}>↳ {country.euTaxNota}</p>}
                    <p><span className="font-semibold" style={{color: colors.textMuted}}>México (LISR):</span> <RiskIndicator text={country.mexTaxHaven} /></p>

        // --- COMPONENTES DE CONTENIDO POR PESTAÑA ---

        const SearchTab = () => {

          const handleSearch = (e) => {

        const MethodologyTab = () => (
          <div>
            <h2 className="text-3xl font-bold mb-4" style={{color: colors.text}}>Contexto y Metodología</h2>
            <div className="space-y-6" style={{color: colors.textMuted}}>
                <div className="p-6 rounded-lg" style={{backgroundColor: colors.card}}>
                    <h3 className="font-bold text-xl mb-2" style={{color: colors.accent3}}>El Problema: Un Enfoque Incompleto</h3>
                    <p>Las matrices de riesgo tradicionales se centran en el cumplimiento normativo (listas GAFI, UE), pero a menudo subestiman el riesgo real delictivo de una jurisdicción. Un país puede tener un marco legal robusto en papel y no estar en ninguna lista, pero ser un epicentro de operaciones para el crimen organizado transnacional. Este panel busca cerrar esa brecha.</p>
                </div>
                <div className="p-6 rounded-lg" style={{backgroundColor: colors.card}}>
                    <h3 className="font-bold text-xl mb-2" style={{color: colors.accent3}}>Nuestra Metodología: Análisis Multidimensional</h3>
                    <p>Integramos seis dimensiones clave del riesgo para ofrecer una visión holística:</p>
                    <ul className="list-decimal list-inside space-y-2 mt-4">
                        <li><span className="font-semibold">Cumplimiento PLD/FT:</span> Listas del GAFI y de la UE. Miden la adecuación del marco normativo.</li>
                        <li><span className="font-semibold">Riesgo Fiscal:</span> Listas de jurisdicciones no cooperativas de la UE (Anexos I y II) y REFIPRES de México (LISR). Miden la opacidad y la falta de cooperación fiscal.</li>
                        <li><span className="font-semibold">Corrupción:</span> Índice de Percepción de la Corrupción (CPI). Mide la percepción de corrupción en el sector público, un facilitador clave del lavado de dinero.</li>
                        <li><span className="font-semibold">Terrorismo:</span> Índice Global de Terrorismo (GTI). Mide el impacto del terrorismo, un riesgo específico de financiación.</li>
                        <li><span className="font-semibold text-orange-400">Crimen Organizado:</span> Índice Global de Crimen Organizado (OC Index). Mide la escala, alcance e influencia de los mercados y actores criminales. <span className="font-bold">Corrige el punto ciego de las listas normativas.</span></li>
                        <li><span className="font-semibold text-red-400">Sanciones Internacionales (nuevo en v10):</span> Regímenes de OFAC, la UE y la ONU. Se clasifican en tres niveles: <span className="font-semibold">Integrales</span> (embargo territorial, hard stop), <span className="font-semibold">Amplias / Sectoriales</span> y <span className="font-semibold">Dirigidas</span> (designaciones de personas y entidades). Es la única dimensión que puede generar responsabilidad directa por vía extraterritorial.</li>
                    </ul>
                </div>
                <div className="p-6 rounded-lg" style={{backgroundColor: colors.card}}>
                    <h3 className="font-bold text-xl mb-2" style={{color: colors.accent3}}>Interpretación de los Índices</h3>
                    <p>Para una correcta evaluación del riesgo, es crucial entender cómo funciona cada indicador:</p>
                    <ul className="list-disc list-inside space-y-2 mt-4">
                        <li><span className="font-semibold">Índice de Percepción de Corrupción (CPI):</span> Escala de 0 a 100. Una puntuación **más baja** indica una **mayor** percepción de corrupción. (Peor = 0, Mejor = 100).</li>
                        <li><span className="font-semibold">Índice Global de Terrorismo (GTI Rank):</span> Es un ranking de 1 a 163. Un ranking **más bajo** (cercano a 1) indica un **mayor** impacto del terrorismo. (Peor = 1, Mejor = 163).</li>
                        <li><span className="font-semibold">Índice de Crimen Organizado (OC Index):</span> Escala de 1 a 10 (criminality score). Una puntuación <span className="font-bold">más alta</span> indica <span className="font-bold">mayor</span> presencia e influencia del crimen organizado. (Peor = 10, Mejor = 1).</li>
                    </ul>
                </div>
                <div className="p-6 rounded-lg" style={{backgroundColor: colors.card}}>
                    <h3 className="font-bold text-xl mb-2" style={{color: colors.accent3}}>Cómo se calcula el 360Score</h3>
                    <p>El 360Score toma el <span className="font-semibold">valor máximo</span> entre todas las dimensiones: una sola señal crítica basta para elevar la calificación. No es un promedio, porque promediar diluiría precisamente las señales que importan.</p>
                    <ul className="list-disc list-inside space-y-1 mt-4 text-sm">
                        <li><span className="font-semibold text-red-400">Nivel 5 · PROHIBIDO:</span> lista negra del GAFI o sanciones integrales. Es una obligación regulatoria, no una decisión de negocio.</li>
                        <li><span className="font-semibold text-purple-300">Nivel 5 · Riesgo Extremo:</span> CPI ≤ 15, GTI ≤ 3 u OC Index ≥ 8.5. Operable solo con aprobación de Dirección y Comité.</li>
                        <li><span className="font-semibold text-orange-300">Nivel 4 · Riesgo Alto:</span> lista gris del GAFI, membresía suspendida, sanciones amplias o sectoriales, CPI ≤ 25, GTI ≤ 8 u OC Index ≥ 7.5.</li>
                        <li><span className="font-semibold text-yellow-300">Nivel 3 · Riesgo Elevado:</span> lista PLD/FT de la UE, Anexo I fiscal de la UE, sanciones dirigidas, CPI ≤ 40, GTI ≤ 15 u OC Index ≥ 7.0.</li>
                        <li><span className="font-semibold text-green-300">Nivel 2 · Riesgo Moderado:</span> Anexo II fiscal de la UE, REFIPRES, CPI ≤ 55, GTI ≤ 25 u OC Index ≥ 6.5.</li>
                        <li><span className="font-semibold text-blue-300">Nivel 1 · Riesgo Bajo:</span> ninguna señal activa.</li>
                    </ul>
                    <p className="mt-4 text-sm"><span className="font-semibold">Distinción clave:</span> "Prohibido" es un hard stop regulatorio. "Riesgo Extremo" es una decisión de negocio que puede tomarse con controles suficientes. Confundirlos lleva a rechazar clientes viables o, peor, a aceptar operaciones que no deberían existir.</p>
                </div>
                <div className="p-6 rounded-lg border-2" style={{backgroundColor: colors.card, borderColor: '#ea580c'}}>
                    <h3 className="font-bold text-xl mb-2" style={{color: '#fb923c'}}>Advertencia: la UE y el GAFI están desalineados</h3>
                    <p>A la fecha de corte, la Unión Europea <span className="font-semibold">no ha transpuesto</span> los plenarios del GAFI de febrero ni de junio de 2026. Esto produce divergencias con consecuencias jurídicas concretas:</p>
                    <ul className="list-disc list-inside space-y-1 mt-3 text-sm">
                        <li><span className="font-semibold">Argelia y Namibia</span> salieron de la lista gris del GAFI, pero siguen en la lista de la UE: la diligencia debida reforzada sigue siendo <span className="font-semibold">obligatoria</span> en la UE.</li>
                        <li><span className="font-semibold">Bosnia y Herzegovina, Irak, Bulgaria, Kuwait y Papúa Nueva Guinea</span> están en la lista gris del GAFI pero no en la de la UE.</li>
                        <li><span className="font-semibold">Afganistán, Trinidad y Tobago y Vanuatu</span> ya no figuran en las listas del GAFI, pero permanecen en la de la UE.</li>
                        <li><span className="font-semibold">Rusia</span> es una designación autónoma de la UE, bajo una categoría creada específicamente para miembros del GAFI suspendidos.</li>
                    </ul>
                    <p className="mt-3 text-sm">Regla práctica: las obligaciones del artículo 18 bis de la Directiva (UE) 2015/849 se activan <span className="font-semibold">solo</span> por la lista de la UE. Las listas del GAFI alimentan la evaluación interna de riesgo, pero no disparan obligaciones legales de forma automática.</p>
                </div>
            </div>
          </div>
        );

        const RiskProfilesTab = () => (
            <div>
                <h2 className="text-3xl font-bold mb-4" style={{color: colors.text}}>Perfiles de Riesgo Integrados (con OC Index)</h2>
                <p className="mb-6" style={{color: colors.textMuted}}>La inclusión del OC Index nos permite crear perfiles de riesgo más precisos y realistas.</p>
                <div className="space-y-6">
                    <div className="p-6 rounded-lg" style={{backgroundColor: colors.card}}>
                        <h3 className="font-bold text-xl mb-2" style={{color: colors.accent1}}>Perfil 1: "Estado Criminalizado" (Ej. Myanmar, Corea del Norte)</h3>
                        <p style={{color: colors.textMuted}}>En <span className="font-semibold">Lista Negra GAFI</span> y con un <span className="font-semibold text-red-500">OC Index {'>'} 7.5</span>. El riesgo es máximo. El estado no solo es incapaz de combatir el crimen, sino que participa activamente en él. Las transacciones son prácticamente indefendibles desde una perspectiva de riesgo.</p>
                    </div>
                    <div className="p-6 rounded-lg" style={{backgroundColor: colors.card}}>
                        <h3 className="font-bold text-xl mb-2" style={{color: colors.accent1}}>Perfil 2: "El Hub Complaciente" (Ej. EAU)</h3>
                        <p style={{color: colors.textMuted}}>Fuera de listas ALD/CFT, pero con un <span className="font-semibold text-orange-500">OC Index de Criminalidad alto ({'>'} 6.5)</span>. Son centros financieros que, a pesar de sus esfuerzos regulatorios, atraen a actores y capitales ilícitos de todo el mundo. El riesgo es de "lavado de segunda etapa" y de tratar con beneficiarios finales de alto riesgo.</p>
                    </div>
                    <div className="p-6 rounded-lg" style={{backgroundColor: colors.card}}>
                        <h3 className="font-bold text-xl mb-2" style={{color: colors.accent1}}>Perfil 3: "El Gigante Herido" (Ej. México, Colombia, Brasil)</h3>
                        <p style={{color: colors.textMuted}}>Fuera de listas GAFI/UE, pero con un <span className="font-semibold text-red-500">OC Index de Criminalidad {'>'} 7.0</span> y baja puntuación en el CPI. El marco legal es adecuado, pero es superado por la escala y poder del crimen organizado. El riesgo principal es la infiltración de capitales ilícitos en la economía formal.</p>
                    </div>
                     <div className="p-6 rounded-lg" style={{backgroundColor: colors.card}}>
                        <h3 className="font-bold text-xl mb-2" style={{color: colors.accent1}}>Perfil 4: "Frontera de Riesgo" (Ej. Bulgaria, Bosnia y Herzegovina)</h3>
                        <p style={{color: colors.textMuted}}>En <span className="font-semibold">Lista Gris del GAFI</span> y con un <span className="font-semibold text-orange-500">OC Index {'>'} 5.5</span>. La debilidad del sistema PLD/FT se combina con su rol como puente para mercados criminales (drogas, migrantes). El riesgo es que las deficiencias regulatorias sean explotadas activamente por redes criminales. Turquía salió de la lista gris en 2024, pero conserva el OC Index más alto del grupo (7.20).</p>
                    </div>
                </div>
            </div>
        );

        const RecommendationsTab = () => (
            <div>
                <h2 className="text-3xl font-bold mb-4" style={{color: colors.text}}>Recomendaciones Estratégicas Evolucionadas</h2>
                <p className="mb-6" style={{color: colors.textMuted}}>Cómo utilizar este modelo enriquecido para una gestión de riesgos superior.</p>
                <div className="space-y-4" style={{color: colors.textMuted}}>
                    <details className="p-4 rounded-lg cursor-pointer" style={{backgroundColor: colors.card}}>
                        <summary className="font-semibold text-lg" style={{color: colors.accent3}}>1. Segmentar la Debida Diligencia por Perfil de Riesgo</summary>
                        <p className="mt-2">No toda la DDR es igual. Para un "Gigante Herido" (México, Brasil), la DDR debe enfocarse en la <span className="font-semibold">identificación de la fuente de la riqueza y los fondos</span>, buscando conexiones con sectores vulnerables al crimen organizado. Para un "Hub Complaciente" (EAU), el foco debe estar en el <span className="font-semibold">análisis reputacional y de redes del beneficiario final</span>.</p>
                    </details>
                    <details className="p-4 rounded-lg cursor-pointer" style={{backgroundColor: colors.card}}>
                        <summary className="font-semibold text-lg" style={{color: colors.accent3}}>2. Utilizar el OC Index como Calificador de Riesgo Inherente</summary>
                        <p className="mt-2">Cualquier jurisdicción con un OC Index de Criminalidad superior a 6.5 debe ser considerada de <span className="font-semibold">riesgo inherentemente alto</span>, independientemente de su estatus en las listas GAFI/UE. Esto debe activar protocolos de debida diligencia reforzada y requerir aprobación de un nivel jerárquico superior.</p>
                    </details>
                    <details className="p-4 rounded-lg cursor-pointer" style={{backgroundColor: colors.card}}>
                        <summary className="font-semibold text-lg" style={{color: colors.accent3}}>3. Desarrollar "Red Flags" Basadas en Tipologías Criminales</summary>
                        <p className="mt-2">Conocer los principales mercados criminales de un país (según el OC Index) permite crear alertas más inteligentes. Por ejemplo, en un país con alto riesgo de tráfico de personas, las transacciones con agencias de viajes o empresas de transporte deben ser examinadas con mayor escrutinio.</p>
                    </details>
                </div>
            </div>
        );


        const SourcesTab = () => {
          const fuentes = [
            { n: 'GAFI · Lista negra y lista gris', v: '19 de junio de 2026', d: 'Plenario del 17-19 de junio de 2026', p: 'Octubre de 2026', c: '#dc2626' },
            { n: 'UE · Terceros países de alto riesgo PLD/FT', v: '29 de enero de 2026', d: 'Reglamentos Delegados (UE) 2026/46 y 2026/83', p: 'Sin fecha anunciada', c: '#ea580c' },
            { n: 'UE · Jurisdicciones no cooperativas (fiscal)', v: '17 de febrero de 2026', d: 'Conclusiones del Consejo ECOFIN', p: 'Octubre de 2026', c: '#ca8a04' },
            { n: 'Transparency International · CPI 2025', v: '10 de febrero de 2026', d: '182 países y territorios', p: 'Enero-febrero de 2027 (estimado)', c: '#16a34a' },
            { n: 'IEP · Global Terrorism Index 2026', v: '19 de marzo de 2026', d: '163 países, datos del año 2025', p: 'Marzo de 2027 (estimado)', c: '#2563eb' },
            { n: 'GI-TOC · Global Organized Crime Index 2025', v: '10 de noviembre de 2025', d: '193 países, ciclo bienal', p: '2027 (estimado)', c: '#9333ea' },
            { n: 'Sanciones · OFAC / UE / ONU', v: 'Agosto de 2026', d: 'Programas por país; revisión sugerida trimestral', p: 'Continua', c: '#0891b2' },
          ];
          const cambios = [
            { t: 'GAFI — Altas en la lista gris', x: 'Bosnia y Herzegovina e Irak, incorporados el 19 de junio de 2026.' },
            { t: 'GAFI — Bajas de la lista gris', x: 'Argelia y Namibia, retiradas el 19 de junio de 2026 tras completar sus planes de acción.' },
            { t: 'UE PLD/FT — Altas', x: 'Bolivia, Islas Vírgenes Británicas y Rusia, desde el 29 de enero de 2026. Rusia entra en una categoría nueva: miembro del GAFI con membresía suspendida.' },
            { t: 'UE PLD/FT — Bajas', x: 'Burkina Faso, Malí, Mozambique, Nigeria, Sudáfrica y Tanzania. La lista pasó de 29 a 26 jurisdicciones.' },
            { t: 'UE Fiscal — Altas al Anexo I', x: 'Islas Turcas y Caicos, por deficiencias en los requisitos de sustancia económica; y Vietnam, elevado desde el Anexo II por no alcanzar la calificación mínima del Foro Global. Vietnam es hoy la única jurisdicción con las tres designaciones simultáneas: lista gris del GAFI, lista PLD/FT de la UE y Anexo I fiscal.' },
            { t: 'UE Fiscal — Bajas del Anexo I', x: 'Fiyi, Samoa y Trinidad y Tobago, delistadas por cumplir los estándares acordados.' },
            { t: 'UE Fiscal — Movimientos en el Anexo II', x: 'Salen Antigua y Barbuda y Seychelles. Entran Groenlandia, Jordania, Marruecos y Montenegro.' },
            { t: 'Sanciones — Cuba se endureció', x: 'La Orden Ejecutiva 14404 (1 de mayo de 2026) introdujo sanciones secundarias aplicables a instituciones financieras extranjeras. Riesgo directo y nuevo para sujetos obligados mexicanos.' },
            { t: 'Sanciones — Siria se relajó', x: 'El programa integral fue archivado y sustituido por PAARSS, de alcance dirigido. El Caesar Act fue derogado en diciembre de 2025.' },
            { t: 'Sanciones — Venezuela se relajó parcialmente', x: 'Licencias generales amplias tras la salida de Maduro, sin revocación de ninguna Orden Ejecutiva.' },
            { t: 'Sanciones — Zimbabue casi salió', x: 'La UE levantó prohibiciones de viaje y congelamientos de activos el 17 de febrero de 2026; solo persiste el embargo de armas.' },
            { t: 'Índices — Recalibración completa', x: 'Se sustituyeron las puntuaciones del OC Index por el criminality score verificado de la edición 2025 (193 países) y los rangos del GTI por los del GTI 2026. Se completó el CPI 2025 para los 182 países cubiertos.' },
            { t: 'Cobertura — 7 jurisdicciones nuevas', x: 'Se incorporaron Vanuatu, Samoa Americana, Guam, Islas Turcas y Caicos, Groenlandia, Túnez y Corea del Sur, ausentes en la versión anterior pese a figurar en listas vigentes o en regímenes de sanciones.' },
          ];
          return (
            <div>
              <h2 className="text-3xl font-bold mb-4" style={{color: colors.text}}>Vigencia de Fuentes y Registro de Cambios</h2>
              <p className="mb-6" style={{color: colors.textMuted}}>
                Corte de datos: <span className="font-bold" style={{color: colors.accent1}}>13 de agosto de 2026</span>. Ninguna calificación de este panel debe usarse sin verificar la fecha de vigencia de la fuente que la sustenta.
              </p>
              <div className="p-6 rounded-lg mb-6" style={{backgroundColor: colors.card}}>
                <h3 className="font-bold text-xl mb-4" style={{color: colors.accent3}}>Fecha de corte por fuente</h3>
                <div className="space-y-3">
                  {fuentes.map((f, i) => (
                    <div key={i} className="pl-4" style={{borderLeft: `4px solid ${f.c}`}}>
                      <div className="font-semibold" style={{color: colors.text}}>{f.n}</div>
                      <div className="text-sm" style={{color: colors.textMuted}}>
                        Vigente desde <span className="font-semibold" style={{color: f.c}}>{f.v}</span> · {f.d}
                      </div>
                      <div className="text-xs mt-1" style={{color: colors.textMuted}}>Próxima actualización esperada: {f.p}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="p-6 rounded-lg" style={{backgroundColor: colors.card}}>
                <h3 className="font-bold text-xl mb-4" style={{color: colors.accent3}}>Qué cambió respecto de la versión de febrero de 2026 (v9)</h3>
                <div className="space-y-4">
                  {cambios.map((c, i) => (
                    <div key={i}>
                      <div className="font-semibold text-sm" style={{color: colors.accent1}}>{c.t}</div>
                      <div className="text-sm" style={{color: colors.textMuted}}>{c.x}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        // --- COMPONENTE PRINCIPAL DE LA APLICACIÓN ---

        const App = () => {
          const [activeTab, setActiveTab] = React.useState('search');

          const tabs = {
            search: { label: 'Buscador', component: <SearchTab /> },
            methodology: { label: 'Contexto y Metodología', component: <MethodologyTab /> },
            profiles: { label: 'Perfiles de Riesgo', component: <RiskProfilesTab /> },
            recommendations: { label: 'Recomendaciones', component: <RecommendationsTab /> },
            sources: { label: 'Vigencia y Cambios', component: <SourcesTab /> },
          };

          const renderContent = () => {
            return tabs[activeTab].component;
          };

          return (
            <div className="min-h-screen w-full p-4 sm:p-6 md:p-8">
              <header className="text-center mb-8">
                <h1 className="text-4xl sm:text-5xl font-extrabold" style={{color: colors.text}}>
                  Panel Interactivo de Riesgo de Jurisdicciones
                </h1>
                <p className="text-lg mt-2" style={{color: colors.textMuted}}>Un enfoque multidimensional que integra cumplimiento, riesgo real delictivo y sanciones internacionales.</p>
                <div className="mt-4 inline-flex flex-wrap justify-center gap-2 text-xs">
                  <span className="px-3 py-1 rounded-full border" style={{borderColor: '#d97706', color: '#fbbf24'}}>v10 · corte 13-ago-2026</span>
                  <span className="px-3 py-1 rounded-full border" style={{borderColor: '#dc2626', color: '#fca5a5'}}>GAFI 19-jun-2026</span>
                  <span className="px-3 py-1 rounded-full border" style={{borderColor: '#ea580c', color: '#fed7aa'}}>UE PLD/FT 29-ene-2026</span>
                  <span className="px-3 py-1 rounded-full border" style={{borderColor: '#ca8a04', color: '#fef08a'}}>UE Fiscal 17-feb-2026</span>
                  <span className="px-3 py-1 rounded-full border" style={{borderColor: '#16a34a', color: '#bbf7d0'}}>CPI 2025</span>
                  <span className="px-3 py-1 rounded-full border" style={{borderColor: '#2563eb', color: '#bfdbfe'}}>GTI 2026</span>
                  <span className="px-3 py-1 rounded-full border" style={{borderColor: '#9333ea', color: '#e9d5ff'}}>OC Index 2025</span>
                </div>
              </header>

              <nav className="flex flex-wrap justify-center items-center mb-8 gap-2 sm:gap-4">
                {Object.keys(tabs).map(tabKey => (
                  <button
                    key={tabKey}
                    onClick={() => setActiveTab(tabKey)}
                    className={`px-4 py-2 text-sm sm:text-base font-semibold rounded-lg transition-all duration-300 border-2 ${
                      activeTab === tabKey
                        ? 'shadow-lg'
                        : 'opacity-70 hover:opacity-100'
                    }`}
                    style={{
                        backgroundColor: activeTab === tabKey ? colors.accent2 : colors.card,
                        borderColor: activeTab === tabKey ? colors.accent2 : 'transparent',
                        color: colors.text
                    }}
                  >
                    {tabs[tabKey].label}
                  </button>
                ))}
              </nav>

              <main className="max-w-5xl mx-auto">
                {renderContent()}
              </main>

              <footer className="text-center mt-12 pt-6 border-t" style={{borderColor: colors.card}}>
                <p className="text-sm" style={{color: colors.textMuted}}>
                  Visualización elaborada por GMC360 · Versión 10, corte de datos al 13 de agosto de 2026 · 187 jurisdicciones.
                  <br />Fuentes: GAFI, Comisión y Consejo de la UE, Transparency International, Institute for Economics &amp; Peace, GI-TOC, OFAC, ONU.
                  <br />Este panel es una herramienta de apoyo a la evaluación de riesgo. No sustituye la verificación directa de las listas oficiales vigentes al momento de cada operación.
                </p>
              </footer>
            </div>
          );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
